<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生产看板</title>
<style>
  /* ═══════════════════════════════════════════════════════════
     配色
     车间大屏常年通电长亮，这里刻意只做暗色一套：暗背景眩光小、
     夜班不刺眼，也能减轻长时间显示的屏幕烧屏。
     ═══════════════════════════════════════════════════════════ */
  :root {
    --plane:       #0d0d0d;   /* 页面底色 */
    --surface:     #1a1a19;   /* 卡片表面 */
    --ink:         #ffffff;   /* 主文字 */
    --ink-2:       #c3c2b7;   /* 次要文字 */
    --ink-muted:   #898781;   /* 弱化文字 */
    --hairline:    rgba(255,255,255,0.10);

    /* 状态色：固定四档，不随主题变化 */
    --good:        #0ca30c;
    --normal:      #3987e5;
    --warning:     #fab219;
    --critical:    #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(16px, 1.8vw, 32px);
    min-height: 100vh;
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Noto Sans CJK SC", sans-serif;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 22px);
  }

  /* ── 顶部标题栏 ───────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 2.2vw, 38px);
    font-weight: 600;
    letter-spacing: .04em;
  }
  .shift {
    font-size: clamp(13px, 1.2vw, 20px);
    color: var(--ink-2);
  }
  .clock {
    margin-left: auto;
    font-size: clamp(18px, 2vw, 34px);
    font-variant-numeric: tabular-nums;  /* 时钟数字要等宽，否则会左右跳动 */
    color: var(--ink-2);
  }

  /* ── 连接状态提示条（数据拉取失败时出现）──────────────── */
  .alert {
    display: none;
    padding: 10px 16px;
    border-radius: 6px;
    background: rgba(208,59,59,0.15);
    border: 1px solid var(--critical);
    color: var(--ink);
    font-size: clamp(13px, 1.2vw, 19px);
  }
  .alert.show { display: block; }

  /* ── 概览区：一个主数字 + 四个指标 ─────────────────────── */
  .overview {
    display: grid;
    grid-template-columns: minmax(200px, 1fr) 2.2fr;
    gap: clamp(12px, 1.4vw, 22px);
  }
  @media (max-width: 760px) {
    .overview { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: clamp(14px, 1.5vw, 26px);
  }

  .label {
    font-size: clamp(12px, 1.05vw, 17px);
    color: var(--ink-muted);
    margin-bottom: .4em;
  }

  /* 主数字：整个看板只有这一个，字号最大 */
  .hero-value {
    font-size: clamp(48px, 7vw, 108px);
    font-weight: 600;
    line-height: 1;
    /* 大号数字用默认比例字形，不要 tabular-nums，否则看着松散 */
  }
  .hero-value .unit {
    font-size: .38em;
    font-weight: 500;
    color: var(--ink-2);
    margin-left: .1em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 1.2vw, 20px);
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-value {
    font-size: clamp(24px, 2.8vw, 46px);
    font-weight: 600;
    line-height: 1.1;
  }

  /* ── 产线明细 ─────────────────────────────────────────── */
  .lines { flex: 1; }
  .lines h2 {
    margin: 0 0 .8em;
    font-size: clamp(14px, 1.2vw, 20px);
    font-weight: 500;
    color: var(--ink-muted);
    letter-spacing: .05em;
  }

  .row {
    display: grid;
    grid-template-columns: 1.4fr auto 1.3fr 2.6fr auto;
    align-items: center;
    gap: clamp(10px, 1.4vw, 26px);
    padding: clamp(10px, 1.1vw, 18px) 0;
    border-bottom: 1px solid var(--hairline);
  }
  .row:last-child { border-bottom: none; }
  @media (max-width: 900px) {
    .row { grid-template-columns: 1fr auto; row-gap: 8px; }
    .row .meter-wrap { grid-column: 1 / -1; }
  }

  .name {
    font-size: clamp(15px, 1.5vw, 27px);
    font-weight: 500;
  }

  /* 状态标记：图标形状 + 文字，绝不只靠颜色区分
     —— 红绿色盲看不出红/绿差别，所以形状和文字才是可靠的识别方式 */
  .status {
    display: inline-flex;
    align-items: center;
    gap: .45em;
    font-size: clamp(13px, 1.2vw, 21px);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .status .icon { font-size: .9em; line-height: 1; }

  .counts {
    font-size: clamp(14px, 1.35vw, 24px);
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;  /* 成列的数字要对齐 */
    white-space: nowrap;
  }
  .counts .actual { color: var(--ink); font-weight: 600; }

  /* 进度条：数据端 4px 圆角，起点方角贴基线 */
  .meter {
    height: 22px;
    border-radius: 4px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 0 4px 4px 0;
    transition: width .6s ease;
  }

  .rate {
    font-size: clamp(15px, 1.5vw, 26px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 4.2em;
  }

  footer {
    font-size: clamp(11px, 1vw, 16px);
    color: var(--ink-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 1.5em;
  }
</style>
</head>
<body>

  <header>
    <h1>生产看板</h1>
    <span class="shift" id="shift">—</span>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <div class="alert" id="alert"></div>

  <section class="overview">
    <div class="card">
      <div class="label">今日总完成率</div>
      <div class="hero-value"><span id="heroRate">--</span><span class="unit">%</span></div>
    </div>

    <div class="stats">
      <div class="card">
        <div class="label">计划产量</div>
        <div class="stat-value" id="totalPlan">--</div>
      </div>
      <div class="card">
        <div class="label">实际产出</div>
        <div class="stat-value" id="totalActual">--</div>
      </div>
      <div class="card">
        <div class="label">在产线数</div>
        <div class="stat-value" id="running">--</div>
      </div>
      <div class="card">
        <div class="label">异常线数</div>
        <div class="stat-value" id="abnormal">--</div>
      </div>
    </div>
  </section>

  <section class="card lines">
    <h2>产线明细</h2>
    <div id="rows"></div>
  </section>

  <footer>
    <span>数据每 3 秒自动刷新</span>
    <span id="lastUpdate">尚未获取数据</span>
  </footer>

<script>
  // ═══════════════════════════════════════════════════════════
  // 状态样式表
  // 每种状态配一个「不同形状」的图标 —— 打印成黑白、或者色盲用户
  // 看，形状和文字依然能区分，不依赖颜色
  // ═══════════════════════════════════════════════════════════
  const STATUS = {
    '运行中': { icon: '▶', color: 'var(--normal)'   },
    '已完成': { icon: '●', color: 'var(--good)'     },
    '待料':   { icon: '◆', color: 'var(--warning)'  },
    '停机':   { icon: '■', color: 'var(--critical)' },
  };

  // 进度条配色：填充色表示严重程度，底槽用同色低透明度
  // ——这样整条进度条（含未完成部分）都在传达同一个状态
  const SEVERITY = {
    good:     { fill: '#0ca30c', track: 'rgba(12,163,12,0.20)'  },
    normal:   { fill: '#3987e5', track: 'rgba(57,135,229,0.20)' },
    warning:  { fill: '#fab219', track: 'rgba(250,178,25,0.20)' },
    critical: { fill: '#d03b3b', track: 'rgba(208,59,59,0.22)'  },
  };

  function severityOf(line) {
    if (line.status === '停机') return 'critical';
    if (line.rate >= 100) return 'good';
    if (line.rate >= 70)  return 'normal';
    if (line.rate >= 40)  return 'warning';
    return 'critical';
  }

  // ═══════════════════════════════════════════════════════════
  // 调用后端接口拿数据
  // ═══════════════════════════════════════════════════════════
  let failCount = 0;      // 连续失败次数
  let lastOkTime = null;  // 上次成功获取数据的时刻

  async function load() {
    try {
      const res = await fetch('/api/progress', { cache: 'no-store' });

      // fetch 只有网络层失败才会 reject，HTTP 404/500 不会自动报错，
      // 所以必须自己检查状态码
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      render(data);

      failCount = 0;
      lastOkTime = Date.now();
      hideAlert();
    } catch (err) {
      failCount++;
      console.error('获取生产数据失败:', err);
      // 偶尔一次网络抖动不弹提示，连续失败才报警，避免误报
      if (failCount >= 2) showAlert(err);
    }
  }

  function showAlert(err) {
    const el = document.getElementById('alert');
    const stale = lastOkTime
      ? '，页面显示的是 ' + Math.round((Date.now() - lastOkTime) / 1000) + ' 秒前的旧数据'
      : '';
    el.textContent = `■ 数据连接异常（已连续失败 ${failCount} 次：${err.message}）${stale}`;
    el.classList.add('show');
  }

  function hideAlert() {
    document.getElementById('alert').classList.remove('show');
  }

  // ═══════════════════════════════════════════════════════════
  // 把数据渲染到页面上
  // ═══════════════════════════════════════════════════════════
  function render(data) {
    const s = data.summary;

    document.getElementById('shift').textContent       = s.rate >= 0 ? data.shift : '';
    document.getElementById('heroRate').textContent    = s.rate.toFixed(1);
    document.getElementById('totalPlan').textContent   = s.totalPlan.toLocaleString('zh-CN');
    document.getElementById('totalActual').textContent = s.totalActual.toLocaleString('zh-CN');
    document.getElementById('running').textContent     = s.running;
    document.getElementById('abnormal').textContent    = s.abnormal;

    document.getElementById('rows').innerHTML = data.lines.map(line => {
      const st  = STATUS[line.status] || { icon: '○', color: 'var(--ink-muted)' };
      const sev = SEVERITY[severityOf(line)];
      const width = Math.min(100, line.rate);

      return `
        <div class="row">
          <div class="name">${line.name}</div>
          <div class="status">
            <span class="icon" style="color:${st.color}">${st.icon}</span>
            <span>${line.status}</span>
          </div>
          <div class="counts">
            <span class="actual">${line.actual.toLocaleString('zh-CN')}</span>
            <span> / ${line.plan.toLocaleString('zh-CN')}</span>
          </div>
          <div class="meter-wrap">
            <div class="meter" style="background:${sev.track}">
              <div class="meter-fill" style="width:${width}%; background:${sev.fill}"></div>
            </div>
          </div>
          <div class="rate">${line.rate.toFixed(1)}%</div>
        </div>
      `;
    }).join('');

    const t = new Date(data.updatedAt);
    document.getElementById('lastUpdate').textContent =
      '最后更新 ' + t.toLocaleTimeString('zh-CN');
  }

  // ═══════════════════════════════════════════════════════════
  // 启动：立即拉一次，之后每 3 秒拉一次
  // ═══════════════════════════════════════════════════════════
  function tickClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('zh-CN');
  }

  tickClock();
  setInterval(tickClock, 1000);

  load();
  setInterval(load, 3000);
</script>
</body>
</html>
